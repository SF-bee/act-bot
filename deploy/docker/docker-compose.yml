# ACT Bot 部署 Compose 模板（业务层 + 协议端）
#
# 适用：Ubuntu 22.04 / 24.04（推荐，生产）｜ macOS Docker Desktop（联调）｜ Windows Docker Desktop + WSL2
# 用法与平台差异见同目录 README.md
#
# 约定：
#   - 本文件不含 QQ 号 / token / 机器绝对路径，凭据一律经 .env 注入；
#   - 协议端与业务层同处一个 bridge 网络，反向 WS 走服务名 act-bot；
#   - 6099 / 3001 仅绑定 127.0.0.1（用 SSH 隧道访问），绝不裸露公网。

name: act-bot

services:
  napcat:
    # 镜像 tag = NapCat 版本，且**自带对应的 QQ 版本**（Docker 里 QQ 由镜像构建时钉死）。
    # 切换/回滚版本用 NAPCAT_IMAGE_TAG（如 v4.18.37）；生产别用 latest（一次 pull 就会
    # 把 NapCat/QQ 悄悄换成新版）。用 NAPCAT_IMAGE 给完整引用（tag 或 digest）钉死版本，
    # 它优先于 NAPCAT_IMAGE_TAG。
    # 注：设备身份不随镜像变（实测各版本镜像的 /etc/machine-id 相同 = 19a5f94f…），
    # 真正会让设备身份漂移的是容器 MAC，见下面的 mac_address。
    #   NAPCAT_IMAGE=mlikiowa/napcat-docker@sha256:<digest>
    # 取 digest：docker image inspect mlikiowa/napcat-docker:latest --format '{{index .RepoDigests 0}}'
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:${NAPCAT_IMAGE_TAG:-latest}}
    container_name: act-napcat
    restart: unless-stopped
    # 固定网卡 MAC（重要）：NapCat 的 Linux 设备指纹 = MD5(/etc/machine-id + 容器 MAC)，
    # 而 Docker 每次「重建」容器都会分配新 MAC，腾讯便判定为新设备并要求验证。
    # 老部署请把当前 MAC 填进 deploy/docker/.env 的 NAPCAT_MAC，以保住现有设备身份。
    mac_address: "${NAPCAT_MAC:-02:42:ac:11:00:42}"
    environment:
      # Linux 宿主：NAPCAT_UID=$(id -u) NAPCAT_GID=$(id -g) docker compose up -d
      # Windows / macOS：保持默认（Docker Desktop 下 UID/GID 语义不同，见 README）
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      # 快速登录（免扫码）：镜像 entrypoint 见 ACCOUNT 会执行 `qq -q $ACCOUNT`。
      # QQ 号只从 .env 注入（NAPCAT_QQ=...），绝不写入仓库；留空则退化为扫码登录。
      ACCOUNT: "${NAPCAT_QQ:-}"
      # 回退密码：快速登录的登录态被腾讯回收时，NapCat 用密码自动重登（免人工扫码）。
      # 凭据只从 deploy/docker/.env 注入，绝不写入仓库；留空则退化为二维码登录。
      NAPCAT_QUICK_PASSWORD: "${NAPCAT_QUICK_PASSWORD:-}"
      NAPCAT_QUICK_PASSWORD_MD5: "${NAPCAT_QUICK_PASSWORD_MD5:-}"
    volumes:
      # NapCat 配置 / 插件 / QQ 登录态必须持久化，否则每次重建都要重新扫码
      - ./runtime/napcat/config:/app/napcat/config
      - ./runtime/napcat/plugins:/app/napcat/plugins
      - ./runtime/ntqq:/app/.config/QQ
    ports:
      - "127.0.0.1:6099:6099"   # WebUI（扫码登录 / 网络配置）
      - "127.0.0.1:3001:3001"   # OneBot 正向 WS（仅 scripts/smoke_protocol.py 联调需要）
    networks:
      - actnet

  act-bot:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: act-bot:local
    container_name: act-bot
    restart: unless-stopped
    env_file:
      # 默认读仓库根 .env（含 ONEBOT_ACCESS_TOKEN 等凭据，不入库）
      - ${ACTBOT_ENV_FILE:-../../.env}
    environment:
      # 容器内必须监听 0.0.0.0，协议端才能连进来；宿主机开发时仍用 127.0.0.1
      HOST: "0.0.0.0"
      PORT: "8080"
      ACTBOT_DATA_DIR: /app/data
      ACTBOT_TIMEZONE: ${ACTBOT_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./runtime/act-bot-data:/app/data
    networks:
      - actnet

networks:
  actnet:
    driver: bridge
