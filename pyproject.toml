[project]
name = "act-bot"
version = "0.1.0"
description = "ACT 动漫社 QQ 群机器人（跨平台：macOS 开发 / Ubuntu 生产 / Windows 支持）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.19",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.nonebot]
adapters = ["~onebot.v11"]
plugin_dirs = ["src/plugins"]
