# ACT Bot 业务配置（示例）
# 用法：复制本文件为 config/config.toml 后按需修改；config.toml 不入库。
# 原则：每个配置项只有一个来源 ——
#   部署相关（地址 / 端口 / token / 数据目录）→ .env
#   业务相关（功能开关 / 限速 / 备份策略）→ 本文件
#   运行时数据（管理员 / 群 / 资料等）→ 数据库

[features]
# 全局功能开关（关掉后该功能在所有群都不响应）。
# 名册以 src/core/features.py 为准，当前可用：welcome / chat / stats / moderation / checkin
welcome = true        # 入群欢迎
chat = false          # 聊天互动（默认关，需显式打开）
stats = true          # 活跃统计
# moderation = true   # 群管理 · 风控（默认开；如需全局关闭改为 false）
# checkin = true      # 群互动 · 签到（默认关，需显式打开）

[persona]
# 机器人对外人设（项目技术名仍是 act-bot，见 README「人设」）
name = "Yulia"
title = "ACT 动漫社助理"
# 群友可能的称呼（供后续聊天引擎/唤醒判断；人设名本身自动算一个称呼）
aliases = ["尤莉娅", "尤莉", "小尤", "群主"]

[welcome]
# 入群欢迎语（本文件是默认值；群级开关在 groups.features，用 /config welcome on|off）
# 占位符：{nickname} 新人在群里的显示名、{group_name} 群名、{user_id} QQ 号、
#         {bot_name} 机器人人设名、{bot_title} 机器人身份
text = "欢迎 {nickname} 加入 ACT 动漫社！我是社团助理 {bot_name}，先看看群公告，有问题随时在群里问～"
# 发送时是否 @ 新人
at_newcomer = true

[chat]
# 聊天引擎（确定性机制，不接 LLM；群级开关用 /config chat on|off）
# 关键词命中后的回应概率（0-1）；被 @ 时必定回应（不受此项影响）
reply_probability = 0.6
# 同一人在同一群的回应冷却（秒）：被 @ 与关键词共用，防止刷屏
cooldown_seconds = 20
# 连续被叫到第几次进入「被叫烦了」档位（>= 2）
escalate_after = 3
# 连续计数多久没再被叫就重新计数（秒）
escalate_window_seconds = 120

[stats]
# 统计（内存累加 → 定时落库；单条消息绝不写库）
# 落库间隔（秒）；/统计 的今日数字 = 内存增量 + 当日已落库，不会因落库而归零
flush_seconds = 60
# 退出时等待统计落库的上限（秒）；超时就放弃并记录未落库计数，避免卡住退出
flush_timeout_seconds = 10
# /统计 里给管理员看的活跃 Top N（仅内存，不落库，重启清空）
top_users = 5
# /统计 的迷你走势显示多少天
trend_days = 7
# /统计 一次最多回看多少天（防止一次拉太久）
range_max_days = 90
# 每日群活跃简报（昨天的数据）私聊给管理员的时间（HH:MM）；off 或留空 = 不发
digest_at = "09:00"

[checkin]
# 群互动 · 签到（全局开关在 [features].checkin，群级开关用 /config checkin on|off）
# 榜单一次显示多少人（1-50）
rank_size = 10
# 默认榜单范围：month（本月）| all（累计）；群里可用 /签到榜 累计 临时切换
rank_scope = "month"
# 占位符：{nickname} {date} {streak} {total} {rank} {milestone} {group_name} {bot_name} {bot_title}
daily_text = "{nickname} 签到成功！连续 {streak} 天，累计 {total} 次，今天第 {rank} 个到～"
repeat_text = "{nickname} 今天已经签过啦，明天再来～（连续 {streak} 天 / 累计 {total} 次）"
milestone_text = "{nickname} 连续签到 {milestone} 天！累计 {total} 次，厉害～"

[broadcast]
# 广播时群与群之间的发送间隔（秒），用于控制频率、降低风控
interval_seconds = 3

[backup]
# 每日自动备份时间（HH:MM，本地时区）
daily_at = "03:00"
# 滚动保留最近 N 天的每日备份
keep_daily_days = 30
# 另外保留最近 N 个月的月度副本
keep_monthly = 6

[alert]
# 协议端掉线提醒：腾讯回收登录态（notice.bot_offline「你的账号当前登录已失效」）时记下
# 时间，等协议端重新连上再私聊管理员一条汇总（掉线时刻 / 掉线前在线多久 / 离线多久）。
# 为什么不在掉线那一刻发：那时账号已经不在线，私聊发不出去。见 src/core/uplink.py
uplink = true

[moderation]
# 群风控（敏感信息撤回警告 / 刷屏禁言 / @全体 / 复读）
# 群级开关用 /config moderation on|off；规则用 /mod add 维护（不预置敏感词）
# 刷屏：窗口内消息数超过阈值即判刷屏
flood_window_seconds = 8
flood_max_messages = 8
flood_action = "mute"        # warn | recall_only | mute | kick
flood_mute_seconds = 600
# 复读：窗口内相同文本/图片重复出现的次数
duplicate_window_seconds = 30
duplicate_max = 3
duplicate_action = "warn"
# @全体成员的处置
mention_all_action = "warn"
# 警告累计到 N 次自动升级为禁言；计数有效期
warn_before_mute = 3
strike_window_seconds = 600
# 同一人两次处置的最小间隔（秒），防止连续处置刷屏
action_cooldown_seconds = 30
# 手动/升级禁言的默认时长与上限（秒，上限 30 天）
default_mute_seconds = 600
max_mute_seconds = 2592000
# 群主/群管理员豁免
exempt_group_admins = true
# true = 只审计不执行（灰度上线用）
dry_run = false
# 警告文案；占位符：{nickname} {user_id} {reason} {count} {limit} {bot_name} {bot_title}
warn_text = "{nickname}，请注意群规：{reason}（累计 {count} 次，达到 {limit} 次将禁言）"
# 内置敏感词库（houbb/sensitive-word-data，已排除政治类；见 src/core/wordlists/）
sensitive_dict = true
# 内置词库命中的处置：warn（撤回+警告）| recall_only | mute | kick
sensitive_action = "warn"
# 是否跳过空白/标点等干扰字符（更严，但误伤略高）
sensitive_skip = false
# 最短命中词长（过滤单字，降低误伤）
sensitive_min_length = 2
# 繁体文本先转简体再匹配（識別「刷單」这类）
sensitive_traditional = true
# 拼音变体匹配（shuadan）；误伤与内存开销略高，默认关
sensitive_pinyin = false
# 内置正则：URL / 域名 / 手机号 / QQ 号
sensitive_patterns = true
sensitive_pattern_action = "warn"
# ── 定时推送 ──────────────────────────────────────────────────────────────
# 一个功能覆盖「每天/每周固定时刻给群或管理员发消息」：只改本文件即可增删，
# 不需要改代码。每条推送一段 [[push]]，可重复多段；改完重启业务层生效。
# 字段：name（必填，唯一）at（必填，HH:MM 或数组）text（必填）
#       weekdays（可选，缺省每天）targets（可选，缺省 ["admins"]）
#       feature（可选，仅群开启该功能时才发）enabled（可选，缺省 true）
# 占位符：{bot_name} {bot_title} {date} {time} {weekday}
# 查看/试发：/push、/push test <名称>
#
# [[push]]
# name = "早报"
# at = "08:00"
# weekdays = ["mon", "wed", "fri"]   # 不写 = 每天；可用 mon..sun 或 周一..周日
# targets = ["all"]                  # "all"=全部已登记群；"admins"=私聊管理员；或写群号
# text = "{bot_name}：早上好，今天是 {date}（{weekday}）～"
#
# [[push]]
# name = "值班提醒"
# at = ["08:00", "20:00"]
# targets = ["admins", "123456789"]
# text = "【值班】{date} {time} 请负责人留意群消息。"
# feature = "stats"

